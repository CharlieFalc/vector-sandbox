---
# OTel Collector ConfigMap
# This is the BASELINE config. The operator PATCHES this ConfigMap whenever
# a SignalPolicy CR changes, then annotates the Deployment to trigger
# a rolling restart.
#
# Key design decisions (interview-worthy):
#
# 1. tail_sampling vs head_sampling:
#    Head sampling (SDK TraceIDRatioBased) is fast but dumb — it decides at
#    span creation without seeing the full trace. Tail sampling decides after
#    the Collector has buffered the full trace — it can make smarter decisions
#    (e.g. always keep errors, keep slow traces, sample healthy traces at 10%).
#
# 2. memory_limiter before batch:
#    Place memory_limiter FIRST in the pipeline so it rejects data early,
#    before the batch processor buffers it. This prevents OOM cascades.
#
# 3. sending_queue backpressure:
#    If SigNoz is slow or down, spans queue here (up to queue_size entries).
#    When full, new data is dropped — this is intentional. The alternative
#    (unbounded queue) causes OOM and takes down the Collector entirely.
#
# 4. retry_on_failure:
#    Separate from sending_queue — retries a failed export with backoff.
#    Combined: queue absorbs bursts, retry handles transient failures.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability-demo
  labels:
    app: otel-collector
    app.kubernetes.io/part-of: observability-demo
  annotations:
    # This annotation is patched by the operator with a SHA-256 hash
    # of the rendered config. When it changes, Kubernetes triggers
    # a rolling restart of the Collector pods.
    observability.demo.dev/config-hash: "initial"
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      # Memory limiter — always first. Drops data before OOMing.
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128

      # Tail sampling — buffers spans for decision_wait seconds, then decides.
      # Policies are evaluated in order; first match wins.
      tail_sampling:
        decision_wait: 10s
        num_traces: 50000
        expected_new_traces_per_sec: 100
        policies:
          # ALWAYS keep error traces — regardless of sampling ratio.
          # This ensures you never miss production incidents in SigNoz.
          - name: always-sample-errors
            type: status_code
            status_code:
              status_codes: [ERROR]

          # ALWAYS keep slow traces (> 1s latency on any span).
          # Use this to debug performance regressions in SigNoz.
          - name: keep-slow-traces
            type: latency
            latency:
              threshold_ms: 1000

          # Sample remaining healthy fast traces at 100%.
          # The operator will lower this based on SignalPolicy.ratioBased.
          - name: probabilistic-sample
            type: probabilistic
            probabilistic:
              sampling_percentage: 100.0

      # Batch processor — buffer spans before exporting.
      # This is the primary throughput lever: larger batches = fewer RPCs.
      batch:
        send_batch_size: 512
        timeout: 5s
        send_batch_max_size: 1024

    exporters:
      otlp/signoz:
        endpoint: signoz-otel-collector:4317
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 1000
          storage: file_storage/queue  # persist queue to disk

      # Expose Collector's own metrics for Prometheus scraping.
      prometheus:
        endpoint: "0.0.0.0:8888"
        namespace: otelcol

    extensions:
      # Persist the sending_queue across restarts — prevents data loss
      # during rolling restarts caused by SignalPolicy changes.
      file_storage/queue:
        directory: /var/lib/otelcol/queue
        timeout: 10s

      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check, file_storage/queue]
      telemetry:
        logs:
          level: info
        metrics:
          address: 0.0.0.0:8888

      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, tail_sampling, batch]
          exporters: [otlp/signoz]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/signoz]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/signoz]

---
# OTel Collector Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability-demo
  labels:
    app: otel-collector
    app.kubernetes.io/component: collector
    app.kubernetes.io/part-of: observability-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
        app.kubernetes.io/part-of: observability-demo
      annotations:
        # Prometheus scrape for Collector's own metrics.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
        prometheus.io/path: "/metrics"
        # Config hash — patched by operator to trigger rolling restarts.
        observability.demo.dev/config-hash: "initial"
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.99.0
          args:
            - --config=/etc/otelcol/config.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: metrics
              containerPort: 8888
            - name: healthcheck
              containerPort: 13133
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            # Persist the sending_queue across pod restarts.
            - name: queue-storage
              mountPath: /var/lib/otelcol/queue
            # Host filesystem — required for the hostmetrics receiver to read
            # /proc, /sys etc. via root_path: /hostfs in the collector config.
            - name: hostfs
              mountPath: /hostfs
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
        - name: queue-storage
          emptyDir: {}   # replace with PVC for production
        - name: hostfs
          hostPath:
            path: /

---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability-demo
  labels:
    app: otel-collector
    app.kubernetes.io/part-of: observability-demo
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: metrics
      port: 8888
      targetPort: 8888
  type: ClusterIP
