---
# SignalPolicy CRD — defines the schema for our custom resource.
#
# This CRD is the control plane for the observability stack.
# Cluster operators create SignalPolicy CRs to tune:
#   - Sampling ratios (head + tail-based)
#   - Batch sizes and timeouts
#   - Backpressure strategies (buffer size, when_full policy)
#
# The signal-forge operator watches these CRs and reconciles the
# OTel Collector and Vector ConfigMaps, then triggers rolling restarts
# via config-hash annotations.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: signalpolicies.observability.demo.dev
  labels:
    app.kubernetes.io/part-of: observability-demo
spec:
  group: observability.demo.dev
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [targetNamespace, sampling, batching, backpressure]
              properties:
                targetNamespace:
                  type: string
                  description: |
                    Namespace where the OTel Collector, Vector, and signal-forge run.
                  default: "observability-demo"

                sampling:
                  type: object
                  description: Controls sampling behaviour.
                  properties:
                    ratioBased:
                      type: number
                      minimum: 0.0
                      maximum: 1.0
                      default: 1.0
                      description: |
                        Head-based sampling ratio (0.0=drop all, 1.0=keep all).
                        Applied in the app SDK via TraceIDRatioBased sampler.
                        The OTel Collector tail_sampling processor then applies
                        smarter per-trace policies on top.
                    alwaysKeepErrors:
                      type: boolean
                      default: true
                      description: |
                        When true, the tail_sampling processor always retains
                        traces containing at least one ERROR span, regardless
                        of the ratioBased setting.
                    alwaysKeepSlowMs:
                      type: integer
                      minimum: 0
                      default: 1000
                      description: |
                        Tail sampling: always keep traces where any span exceeds
                        this latency (ms). Set to 0 to disable.

                batching:
                  type: object
                  description: Controls OTel Collector batch processor settings.
                  properties:
                    sendBatchSize:
                      type: integer
                      minimum: 1
                      default: 512
                      description: Max spans per export RPC call.
                    timeoutSeconds:
                      type: integer
                      minimum: 1
                      default: 5
                      description: Flush batch after this many seconds even if not full.
                    queueSize:
                      type: integer
                      minimum: 1
                      default: 1000
                      description: |
                        OTel Collector exporter sending_queue size.
                        Spans/metrics queue here if the downstream (SigNoz) is slow.
                        When full, new data is dropped — this is intentional to prevent
                        unbounded memory growth.

                backpressure:
                  type: object
                  description: Controls Vector buffer settings.
                  properties:
                    vectorBufferMaxBytes:
                      type: integer
                      minimum: 1048576
                      default: 268435456
                      description: |
                        Maximum disk buffer size for Vector's SigNoz sink (bytes).
                        Default: 256MB. Increase if SigNoz has long downtime windows.
                    whenFull:
                      type: string
                      enum: [drop_newest, block]
                      default: drop_newest
                      description: |
                        Vector behaviour when the buffer is full.
                        drop_newest: new logs are discarded (prefer low latency).
                        block: Vector pauses ingestion (prefer zero log loss).

            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Reconciling, Active, Failed]
                otelConfigHash:
                  type: string
                vectorConfigHash:
                  type: string
                lastReconcileTime:
                  type: string
                  format: date-time
                message:
                  type: string

      # Expose status fields in kubectl get output
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: OtelHash
          type: string
          jsonPath: .status.otelConfigHash
        - name: VectorHash
          type: string
          jsonPath: .status.vectorConfigHash
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

      subresources:
        status: {}

  scope: Namespaced
  names:
    plural: signalpolicies
    singular: signalpolicy
    kind: SignalPolicy
    shortNames: [sp]
