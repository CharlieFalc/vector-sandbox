---
# Default SignalPolicy — suitable for development / low-traffic.
# Sample everything, keep all errors and slow traces, moderate batch size.
apiVersion: observability.demo.dev/v1alpha1
kind: SignalPolicy
metadata:
  name: default
  namespace: observability-demo
  labels:
    app.kubernetes.io/part-of: observability-demo
spec:
  targetNamespace: observability-demo
  sampling:
    ratioBased: 1.0           # sample 100% of traces (safe for dev)
    alwaysKeepErrors: true     # always keep error traces regardless of ratio
    alwaysKeepSlowMs: 1000     # always keep traces with any span > 1s
  batching:
    sendBatchSize: 512
    timeoutSeconds: 5
    queueSize: 1000
  backpressure:
    vectorBufferMaxBytes: 536870912  # 512MB disk buffer (Vector minimum is ~256MB+)
    whenFull: drop_newest
