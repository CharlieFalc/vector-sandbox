---
# High-sampling SignalPolicy — production-like with aggressive tail sampling.
# Only 10% of healthy fast traces are kept; errors and slow traces always kept.
# This simulates what you'd apply in a high-traffic production cluster.
apiVersion: observability.demo.dev/v1alpha1
kind: SignalPolicy
metadata:
  name: high-sampling
  namespace: observability-demo
  labels:
    app.kubernetes.io/part-of: observability-demo
    environment: production-sim
spec:
  targetNamespace: observability-demo
  sampling:
    ratioBased: 0.1           # 10% head-based pre-filter
    alwaysKeepErrors: true     # override ratio for error traces
    alwaysKeepSlowMs: 500      # override for any span > 500ms
  batching:
    sendBatchSize: 1024        # larger batches → fewer RPCs → higher throughput
    timeoutSeconds: 10         # flush less frequently → better batching
    queueSize: 5000            # larger queue → more tolerance for SigNoz hiccups
  backpressure:
    vectorBufferMaxBytes: 536870912  # 512MB — more headroom for production
    whenFull: drop_newest
