---
# Backpressure-demo SignalPolicy — shows "block" mode for zero log loss.
# Use this to demonstrate the when_full=block tradeoff in an interview:
#   drop_newest: low latency, may lose recent logs under sustained pressure
#   block:       zero log loss, but Vector's read loop pauses → CPU blocks
apiVersion: observability.demo.dev/v1alpha1
kind: SignalPolicy
metadata:
  name: backpressure-demo
  namespace: observability-demo
  labels:
    app.kubernetes.io/part-of: observability-demo
    demo: backpressure
spec:
  targetNamespace: observability-demo
  sampling:
    ratioBased: 1.0
    alwaysKeepErrors: true
    alwaysKeepSlowMs: 0       # disable slow-trace filter for cleaner demo
  batching:
    sendBatchSize: 64         # tiny batches → more RPCs → easier to see queue fill
    timeoutSeconds: 1         # flush every second
    queueSize: 50             # small queue → fills quickly to show backpressure
  backpressure:
    vectorBufferMaxBytes: 10485760  # 10MB — fills fast for demo purposes
    whenFull: block                  # pause Vector rather than drop logs
