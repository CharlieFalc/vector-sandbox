---
# Namespace — all demo components run here.
apiVersion: v1
kind: Namespace
metadata:
  name: observability-demo
  labels:
    app.kubernetes.io/part-of: observability-demo

---
# ServiceAccount for the signal-forge operator.
# The operator needs to:
#   - Read SignalPolicy CRs
#   - Write ConfigMaps (otel-collector-config, vector-config)
#   - Patch Deployments (rolling restart via annotation)
#   - Update SignalPolicy status subresource
apiVersion: v1
kind: ServiceAccount
metadata:
  name: signal-forge-operator
  namespace: observability-demo
  labels:
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: observability-demo

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: signal-forge-operator
  namespace: observability-demo
  labels:
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: observability-demo
rules:
  # Read/write ConfigMaps — the operator renders and applies OTel+Vector configs.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch]

  # Patch Deployments — for rolling restart via config-hash annotation.
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, patch]

  # Read/write SignalPolicy CRs + status subresource.
  - apiGroups: [observability.demo.dev]
    resources: [signalpolicies]
    verbs: [get, list, watch]
  - apiGroups: [observability.demo.dev]
    resources: [signalpolicies/status]
    verbs: [get, update, patch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: signal-forge-operator
  namespace: observability-demo
  labels:
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: observability-demo
subjects:
  - kind: ServiceAccount
    name: signal-forge-operator
    namespace: observability-demo
roleRef:
  kind: Role
  name: signal-forge-operator
  apiGroup: rbac.authorization.k8s.io

---
# ServiceAccount for the signal-forge app (least privilege — no k8s API access needed).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: signal-forge
  namespace: observability-demo
  labels:
    app.kubernetes.io/component: app
    app.kubernetes.io/part-of: observability-demo
