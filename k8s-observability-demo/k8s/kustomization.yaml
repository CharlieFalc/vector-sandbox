---
# kustomization.yaml — apply everything with: kubectl apply -k k8s/
#
# Apply order matters:
#   1. CRDs first (must exist before any CR can be created)
#   2. Namespace + RBAC
#   3. App workloads + Collector + Vector
#   4. SignalPolicy CR (creates the default policy; operator picks it up)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # 1. CRDs
  - crds/signalpolicy.yaml

  # 2. Namespace + RBAC
  - rbac/rbac.yaml
  - vector/vector-daemonset.yaml  # includes Vector RBAC

  # 3. Workloads
  - app/deployment.yaml
  - collector/otel-collector.yaml
  - vector/vector.yaml

  # 4. Default SignalPolicy CR
  - signalpolicy/default.yaml

commonLabels:
  app.kubernetes.io/part-of: observability-demo
  app.kubernetes.io/managed-by: kustomize
