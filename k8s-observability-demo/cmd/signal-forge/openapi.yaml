openapi: "3.0.3"
info:
  title: signal-forge API
  description: |
    Demo application for the k8s-observability-demo.
    Emits OTel traces, metrics, and structured JSON logs on every request.
    Use the /simulate/* endpoints to generate interesting signals in SigNoz.
  version: "0.1.0"

servers:
  - url: http://localhost:8080
    description: Local (port-forwarded from Kubernetes)

tags:
  - name: widgets
    description: CRUD operations for Widget resources
  - name: simulate
    description: Endpoints that generate interesting OTel signals for demo purposes

paths:
  /api/v1/widgets:
    post:
      operationId: createWidget
      tags: [widgets]
      summary: Create a widget
      description: Creates a new widget and emits a CREATE span + metric increment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWidgetRequest"
            example:
              name: "my-widget"
              color: "blue"
              weight: 1.5
      responses:
        "201":
          description: Widget created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Widget"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

    get:
      operationId: listWidgets
      tags: [widgets]
      summary: List widgets
      parameters:
        - name: color
          in: query
          schema:
            type: string
          description: Filter by color
      responses:
        "200":
          description: Widget list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetList"

  /api/v1/widgets/{widgetId}:
    parameters:
      - name: widgetId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      operationId: getWidget
      tags: [widgets]
      summary: Get a widget by ID
      responses:
        "200":
          description: Widget found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Widget"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteWidget
      tags: [widgets]
      summary: Delete a widget
      responses:
        "204":
          description: Widget deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/simulate/slow:
    get:
      operationId: simulateSlow
      tags: [simulate]
      summary: Generate a slow trace (2s latency)
      description: |
        Sleeps for 2 seconds with a child "slowDBQuery" span.
        Use this to verify that the OTel Collector tail_sampling processor
        retains high-latency traces even with aggressive sampling ratios.
      responses:
        "200":
          description: Slow request completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  traceId:
                    type: string

  /api/v1/simulate/error:
    get:
      operationId: simulateError
      tags: [simulate]
      summary: Generate an error trace
      description: |
        Returns 503 with an error span. Use to verify SigNoz error tracking
        and that tail_sampling "always_sample" policy fires for error spans.
      responses:
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  schemas:
    Widget:
      type: object
      required: [id, name, color, weight, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        color:
          type: string
        weight:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateWidgetRequest:
      type: object
      required: [name, color, weight]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        color:
          type: string
        weight:
          type: number
          format: double
          minimum: 0

    WidgetList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Widget"
        total:
          type: integer

    APIError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    ServiceUnavailable:
      description: Service unavailable (simulated)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
