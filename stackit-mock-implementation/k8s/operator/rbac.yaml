apiVersion: v1
kind: ServiceAccount
metadata:
  name: telemetry-operator
  namespace: telemetry-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: telemetry-operator
rules:
  # Watch and manage TelemetryRouter CRDs
  - apiGroups: ["telemetry.stackit.local"]
    resources: ["telemetryrouters"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["telemetry.stackit.local"]
    resources: ["telemetryrouters/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["telemetry.stackit.local"]
    resources: ["telemetryrouters/finalizers"]
    verbs: ["update"]
  # Manage ConfigMaps (Vector config)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Manage Deployments (Vector deployments)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Manage Services (Vector services)
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # List/watch Pods — required by isVectorCrashLooping to detect crash-loop
  # state on Vector pods after a config rollout.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Events for operator status
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: telemetry-operator
subjects:
  - kind: ServiceAccount
    name: telemetry-operator
    namespace: telemetry-system
roleRef:
  kind: ClusterRole
  name: telemetry-operator
  apiGroup: rbac.authorization.k8s.io
