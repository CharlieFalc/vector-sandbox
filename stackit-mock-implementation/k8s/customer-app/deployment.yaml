apiVersion: apps/v1
kind: Deployment
metadata:
  name: price-service
  namespace: customer-app
  labels:
    app: price-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: price-service
  template:
    metadata:
      labels:
        app: price-service
    spec:
      containers:
        - name: price-service
          image: stackit-mock/price-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            # All OTel signals → Vector (logs+traces+metrics).
            # Vector 0.44 routes each signal to the appropriate backend:
            #   Logs    → enrich (VRL) → Loki
            #   Traces  → opentelemetry sink (otlp codec) → Tempo :4318
            #   Metrics → opentelemetry sink (otlp codec) → Prometheus OTLP receiver
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://vector.telemetry-system.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: "price-service"
            - name: OTEL_SERVICE_VERSION
              value: "1.0.0"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=local,k8s.namespace=customer-app,k8s.cluster=docker-desktop"
            - name: OTEL_PYTHON_LOG_CORRELATION
              value: "true"
            - name: OTEL_PYTHON_LOG_LEVEL
              value: "info"
            - name: OTEL_LOGS_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_TRACES_SAMPLER
              value: "always_on"
            # App config
            - name: PORT
              value: "8000"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: price-service
  namespace: customer-app
  labels:
    app: price-service
spec:
  selector:
    app: price-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
