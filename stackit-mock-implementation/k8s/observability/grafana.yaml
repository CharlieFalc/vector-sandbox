---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus.observability.svc.cluster.local:9090
        access: proxy
        isDefault: true
        jsonData:
          httpMethod: POST
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: tempo

      - name: Loki
        type: loki
        uid: loki
        url: http://loki.observability.svc.cluster.local:3100
        access: proxy
        jsonData:
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: '"trace_id":\s*"([a-f0-9]+)"'
              name: TraceID
              url: "$${__value.raw}"
              urlDisplayLabel: "View Trace in Tempo"

      - name: Tempo
        type: tempo
        uid: tempo
        url: http://tempo.observability.svc.cluster.local:3200
        access: proxy
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-1m"
            spanEndTimeShift: "1m"
            filterByTraceID: false
            customQuery: true
            tags:
              - key: service.name
                value: service_name
            query: '{service_name="${__tags.service_name}"} | json | trace_id="${__span.traceId}"'
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
          search:
            hide: false
          lokiSearch:
            datasourceUid: loki

      # OpenSearch datasource — provisioned when 'make apply-opensearch' is run.
      # Uses the grafana-opensearch-datasource plugin (installed via GF_INSTALL_PLUGINS)
      # rather than the built-in elasticsearch type. Grafana 11 dropped support for
      # the built-in elasticsearch datasource with ES versions < 7.16, and OpenSearch
      # 2.x reports itself as 7.10.2 — so the built-in type shows a blocking warning.
      # The dedicated OpenSearch plugin handles the version difference correctly.
      - name: OpenSearch
        type: grafana-opensearch-datasource
        uid: opensearch
        url: http://opensearch.observability.svc.cluster.local:9200
        access: proxy
        jsonData:
          database: "telemetry-logs-*"
          flavor: "OpenSearch"
          version: "2.15.0"
          # Vector's OTLP log source writes the event time as "timestamp",
          # not "@timestamp". Grafana uses this field for all time-range
          # filtering — wrong value = every query returns zero results.
          timeField: "timestamp"
          logMessageField: "message"
          maxConcurrentShardRequests: 5
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: observability
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'stackit-mock'
        orgId: 1
        folder: 'STACKIT Mock'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-price-service
  namespace: observability
data:
  price-service.json: |
    {
      "title": "Price Service — Telemetry Overview",
      "uid": "price-service-overview",
      "tags": ["stackit-mock", "price-service"],
      "timezone": "browser",
      "schemaVersion": 38,
      "refresh": "10s",
      "time": {"from": "now-30m", "to": "now"},
      "templating": {
        "list": [
          {
            "name": "service",
            "type": "constant",
            "current": {"value": "price-service"},
            "hide": 2
          }
        ]
      },
      "panels": [
        {
          "id": 1, "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "type": "stat", "title": "Request Rate (req/s)",
          "datasource": {"uid": "prometheus"},
          "targets": [{"expr": "(sum(increase(traces_spanmetrics_calls_total{service=\"price-service\",span_kind=\"SPAN_KIND_SERVER\",span_name!=\"GET /health\"}[5m])) / 300) or on() vector(0)", "legendFormat": "req/s"}],
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"steps": [{"color": "green", "value": null}]}, "unit": "reqps"}}
        },
        {
          "id": 2, "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "type": "stat", "title": "Error Rate (%)",
          "datasource": {"uid": "prometheus"},
          "targets": [{"expr": "(100 * sum(increase(traces_spanmetrics_calls_total{service=\"price-service\",span_kind=\"SPAN_KIND_SERVER\",status_code=\"STATUS_CODE_ERROR\",span_name!=\"GET /health\"}[5m])) / clamp_min(sum(increase(traces_spanmetrics_calls_total{service=\"price-service\",span_kind=\"SPAN_KIND_SERVER\",span_name!=\"GET /health\"}[5m])), 1)) or on() vector(0)", "legendFormat": "error %"}],
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}, {"color": "red", "value": 5}]}, "unit": "percent"}}
        },
        {
          "id": 3, "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "type": "stat", "title": "p99 Latency",
          "datasource": {"uid": "prometheus"},
          "targets": [{"expr": "histogram_quantile(0.99, sum(rate(traces_spanmetrics_latency_bucket{service=\"price-service\",span_kind=\"SPAN_KIND_SERVER\",span_name!=\"GET /health\"}[5m])) by (le)) or on() vector(0)", "legendFormat": "p99"}],
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 0.5}, {"color": "red", "value": 1}]}, "unit": "s"}}
        },
        {
          "id": 4, "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "type": "stat", "title": "Active Vector Buffer",
          "datasource": {"uid": "prometheus"},
          "targets": [{"expr": "sum(vector_buffer_events{component_kind=\"sink\"})", "legendFormat": "buffered events"}],
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1000}, {"color": "red", "value": 10000}]}}}
        },
        {
          "id": 5, "gridPos": {"h": 8, "w": 6, "x": 0, "y": 4},
          "type": "timeseries", "title": "Request Rate by Endpoint",
          "datasource": {"uid": "prometheus"},
          "targets": [{"expr": "sum by (span_name) (increase(traces_spanmetrics_calls_total{service=\"price-service\",span_kind=\"SPAN_KIND_SERVER\",span_name!=\"GET /health\"}[5m])) / 300", "legendFormat": "{{span_name}}"}]
        },
        {
          "id": 6, "gridPos": {"h": 8, "w": 6, "x": 6, "y": 4},
          "type": "timeseries", "title": "Latency Percentiles",
          "datasource": {"uid": "prometheus"},
          "targets": [
            {"expr": "histogram_quantile(0.50, sum(rate(traces_spanmetrics_latency_bucket{service=\"price-service\",span_kind=\"SPAN_KIND_SERVER\",span_name!=\"GET /health\"}[5m])) by (le))", "legendFormat": "p50"},
            {"expr": "histogram_quantile(0.95, sum(rate(traces_spanmetrics_latency_bucket{service=\"price-service\",span_kind=\"SPAN_KIND_SERVER\",span_name!=\"GET /health\"}[5m])) by (le))", "legendFormat": "p95"},
            {"expr": "histogram_quantile(0.99, sum(rate(traces_spanmetrics_latency_bucket{service=\"price-service\",span_kind=\"SPAN_KIND_SERVER\",span_name!=\"GET /health\"}[5m])) by (le))", "legendFormat": "p99"}
          ],
          "fieldConfig": {"defaults": {"unit": "s"}}
        },
        {
          "id": 7, "gridPos": {"h": 8, "w": 6, "x": 12, "y": 4},
          "type": "timeseries", "title": "Vector — Events Processed",
          "datasource": {"uid": "prometheus"},
          "targets": [
            {"expr": "sum by (component_name) (rate(vector_component_sent_events_total[1m]))", "legendFormat": "sent: {{component_name}}"},
            {"expr": "sum by (component_name) (rate(vector_component_received_events_total[1m]))", "legendFormat": "recv: {{component_name}}"}
          ]
        },
        {
          "id": 9, "gridPos": {"h": 8, "w": 12, "x": 0, "y": 21},
          "type": "logs", "title": "Price Service Logs (via Vector → Loki)",
          "datasource": {"uid": "loki"},
          "targets": [{"expr": "{service_name=\"price-service\"}", "legendFormat": ""}],
          "options": {"showTime": true, "sortOrder": "Descending", "wrapLogMessage": false, "enableLogDetails": true}
        },
        {
          "id": 8, "gridPos": {"h": 8, "w": 6, "x": 18, "y": 4},
          "type": "timeseries", "title": "Vector — Buffer Utilisation",
          "datasource": {"uid": "prometheus"},
          "targets": [
            {"expr": "vector_buffer_events{component_kind=\"sink\"}", "legendFormat": "{{component_name}} buffered"},
            {"expr": "vector_buffer_discarded_events_total{component_kind=\"sink\"}", "legendFormat": "{{component_name}} dropped"}
          ]
        },
        {
          "id": 10, "gridPos": {"h": 9, "w": 24, "x": 0, "y": 12},
          "type": "table", "title": "Recent Traces — price-service",
          "datasource": {"uid": "tempo"},
          "targets": [{
            "datasource": {"type": "tempo", "uid": "tempo"},
            "queryType": "traceql",
            "query": "{resource.service.name=\"price-service\"}",
            "limit": 20,
            "tableType": "traces",
            "refId": "A"
          }],
          "options": {"showHeader": true}
        },
        {
          "id": 12, "gridPos": {"h": 8, "w": 12, "x": 12, "y": 21},
          "type": "logs",
          "title": "Price Service Logs (via Vector → OpenSearch)",
          "description": "Populated after 'make apply-opensearch' — shows No data until the OpenSearch sink is added to the TelemetryRouter.",
          "datasource": {"uid": "opensearch"},
          "targets": [{
            "query": "*",
            "metrics": [{"type": "logs", "id": "1", "settings": {"limit": "500"}}],
            "timeField": "timestamp",
            "refId": "A"
          }],
          "options": {
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none"
          }
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Admin"
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            - name: GF_FEATURE_TOGGLES_ENABLE
              value: "traceqlEditor tempoApmTable traceToMetrics"
            # grafana-opensearch-datasource is required for OpenSearch 2.x support.
            # Grafana 11 removed built-in ES datasource support for versions < 7.16,
            # and OpenSearch 2.x reports ES 7.10.2 compatibility — so the dedicated
            # plugin is the correct way to connect. Downloaded on pod startup.
            - name: GF_INSTALL_PLUGINS
              value: "grafana-opensearch-datasource"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-config
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: data
              mountPath: /var/lib/grafana
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-config
          configMap:
            name: grafana-dashboards-config
        - name: dashboards
          projected:
            sources:
              - configMap:
                  name: grafana-dashboard-price-service
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  type: ClusterIP
